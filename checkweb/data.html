<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bakery Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fffaf5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #5c3a21;
    }
    /* Grid Layout taake cards saaf nazar aayein */
    #products-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
    }
    .card {
      background: white;
      border: 1px solid #ead8c8;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }
    .category {
      font-size: 12px;
      color: #b5651d;
      font-weight: bold;
      margin-top: 10px;
    }
    .card h3 {
      margin: 5px 0;
      color: #333;
      font-size: 18px;
    }
    .card p {
      font-size: 13px;
      color: #666;
    }
    .price {
      font-size: 18px;
      font-weight: bold;
      color: #5c3a21;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🍰 Our Bakery Products</h1>
  
  <!-- Yahan saare 300 products khud-ba-khud aa jayenge -->
  <div id="products-container">Loading products...</div>

  <script>
    // 1. data.json file ko mangwana
    fetch('data.json')
      .then(response => response.json())
      .then(products => {
        const container = document.getElementById('products-container');
        container.innerHTML = ''; // "Loading..." text hatane ke liye

        // 2. Har product ke liye ek card banana
        products.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          card.innerHTML = `
            <img src="${item.image}" alt="${item.name}">
            <div class="category">${item.category}</div>
            <h3>${item.name}</h3>
            <p>${item.description}</p>
            <div class="price">Rs. ${item.price}</div>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('products-container').innerHTML = 
          '<p style="color:red; text-align:center;">Data load nahi ho saka. Live Server use karein!</p>';
      });
  </script>

</body>
</html>
